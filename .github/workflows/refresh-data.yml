name: Refresh open data

on:
  schedule:
    - cron: "0 4 1 * *"   # 04:00 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download BAG, monuments and permit notices
        run: python3 scripts/fetch_leiden.py
      - name: Commit if the data changed
        run: |
          if git diff --quiet data/leiden.json; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leiden.json
          git commit -m "Refresh open data ($(date -u +%Y-%m-%d))"
          git push
